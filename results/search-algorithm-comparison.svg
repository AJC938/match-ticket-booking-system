<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560"><rect width="1100" height="560" rx="20" fill="#0b1710"/><text x="70" y="80" fill="#fff" font-family="Arial" font-size="34" font-weight="700">Search Algorithm Comparison</text><text x="70" y="115" fill="#a9b9af" font-family="Arial" font-size="18">Asymptotic lookup complexity used by the booking system</text><g font-family="Arial" font-size="20" fill="#fff"><text x="70" y="185">Linear Search</text><text x="70" y="285">Binary Search</text><text x="70" y="385">Hash Search</text></g><g fill="#e7b85b"><rect x="260" y="155" width="650" height="46" rx="8"/><rect x="260" y="255" width="180" height="46" rx="8"/><rect x="260" y="355" width="55" height="46" rx="8"/></g><g fill="#dce8df" font-family="Arial" font-size="18"><text x="930" y="186">O(n)</text><text x="460" y="286">O(log n)</text><text x="335" y="386">O(1) avg.</text></g><line x1="260" y1="445" x2="910" y2="445" stroke="#385640"/><text x="260" y="485" fill="#a9b9af" font-family="Arial" font-size="16">Lower asymptotic growth is better for large lookup workloads.</text></svg>