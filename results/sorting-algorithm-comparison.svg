<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560"><rect width="1100" height="560" rx="20" fill="#0b1710"/><text x="70" y="80" fill="#fff" font-family="Arial" font-size="34" font-weight="700">Sorting Algorithm Comparison</text><text x="70" y="115" fill="#a9b9af" font-family="Arial" font-size="18">Asymptotic complexity used in the attendance-ranking benchmark</text><g font-family="Arial" font-size="20" fill="#fff"><text x="70" y="205">Bubble Sort</text><text x="70" y="335">Merge Sort</text></g><g fill="#e7b85b"><rect x="260" y="170" width="650" height="55" rx="8"/><rect x="260" y="300" width="250" height="55" rx="8"/></g><g fill="#dce8df" font-family="Arial" font-size="18"><text x="930" y="205">O(n²)</text><text x="530" y="335">O(n log n)</text></g><line x1="260" y1="425" x2="910" y2="425" stroke="#385640"/><text x="260" y="465" fill="#a9b9af" font-family="Arial" font-size="16">Merge Sort provides the scalable baseline for larger datasets.</text></svg>